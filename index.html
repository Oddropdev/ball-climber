<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9d7f8">
<title>Ball Climber — C0 Physics Prototype</title>
</head><body>
<main id="game">
  <canvas id="application-canvas" aria-label="Ball Climber real physics game"></canvas>
  <div id="hud">
    <header><div><small>ODDROP / C0 PHYSICS</small><strong>BALL CLIMBER</strong></div>
      <div class="score"><span id="loot">0</span><small> LOOT</small></div></header>
    <div class="progress"><div id="progress"></div></div>
    <div id="status">Preparing real physics…</div>
    <div id="toast" aria-live="polite"></div>
    <section id="dialog">
      <div class="eyebrow">PHYSICS CLIMBING PROTOTYPE</div>
      <h1 id="title">CLIMB. <em>DODGE.</em> COLLECT.</h1>
      <p id="description">Climb a steep cliff on a magnetically assisted ball. Dodge real falling rocks and collect falling loot.</p>
      <button id="start" type="button" disabled>LOADING…</button>
      <small>Swipe sideways or use ← → · Space to restart</small>
    </section>
    <div class="hint">← DRAG TO CLIMB SIDEWAYS →</div>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body></html>
