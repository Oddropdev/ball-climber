name: C0.4 Furniture Flow & Camera
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/c0-4-furniture-flow.yml'
      - 'docs/C0-4_HANDOFF.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  furniture:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'c0-4-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Hollow furniture contract, visibility geometry, unit and production build
        run: |
          npm run test
          npm run build
      - name: Real Bullet camera, live-resize, hold-drive, swipe, furniture regressions
        run: npm run test:browser
      - name: Owner playable game and real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-4-furniture-flow-owner-preview
          path: |
            dist/
            test-results/
            Start_Ball_Climber.cmd
            tools/serve-preview.mjs
            docs/C0-4_HANDOFF.md
          if-no-files-found: warn
