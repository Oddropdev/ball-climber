name: C0.7 Readability and Mobile Preview
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/c0-7-readability.yml'
      - 'docs/C0-7_HANDOFF.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  readability:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'c0-7-gameplay-readability'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Real unit physics contracts, TS, clean compile
        run: |
          npm run test
          npm run build
      - name: C0.7 true browser tests, C0-C0.6 physics regressions
        run: npm run test:browser
      - name: Ensure owner preview is only public compiled artifacts
        run: |
          test -s dist/index.html
          test -f dist/ammo/ammo.wasm.wasm
          if find dist -type f | grep -Ei '\.(zip|env|pem|key|p12|ps1|map)$|licensed|private'; then
            echo 'Disallowed private or unsafe file in C0.7 public output'
            exit 1
          fi
          echo 'C0_7_PUBLIC_PREVIEW_CONTENT_PASS'
      - name: Publish green compiled site only to independent C0.7 staging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build from ${GITHUB_SHA}" > dist/BUILD_ORIGIN.txt
          cd dist
          git init -b main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'C0.7 read-only mobile preview, no private assets'
          git remote add origin 'https://x-access-token:'"${GH_TOKEN}"'@github.com/Oddropdev/ball-climber.git'
          git push origin HEAD:refs/heads/c0-7-mobile-static-preview
      - name: Owner build + screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-7-readability-owner-preview
          path: |
            dist/
            test-results/
            Start_Ball_Climber.cmd
            tools/serve-preview.mjs
            docs/C0-7_HANDOFF.md
          if-no-files-found: warn
